services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  AUS\AusDriverAmazonS3\:
    resource: '../Classes/*'

  AUS\AusDriverAmazonS3\EventListener\AfterFileAddedToIndexEventListener:
    tags:
      - name: event.listener
        identifier: 'ausDriverAmazonS3'
        event: TYPO3\CMS\Core\Resource\Event\AfterFileAddedToIndexEvent
  AUS\AusDriverAmazonS3\EventListener\AfterFileUpdatedInIndexEventListener:
    tags:
      - name: event.listener
        identifier: 'ausDriverAmazonS3'
        event: TYPO3\CMS\Core\Resource\Event\AfterFileUpdatedInIndexEvent
  AUS\AusDriverAmazonS3\EventListener\PolicyMutatedEventListener:
    tags:
      - name: event.listener
        identifier: 'ausDriverAmazonS3/content-security-policy'
        event: TYPO3\CMS\Core\Security\ContentSecurityPolicy\Event\PolicyMutatedEvent
